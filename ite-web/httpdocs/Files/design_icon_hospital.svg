  <rect x="47" y="135" width="16" height="12" fill="none" stroke="#901446" stroke-width="3" />
  <!-- ปีกอาคารฝั่งขวา (ระแนง) -->
  <line x1="145" y1="80" x2="175" y2="80" stroke="#901446" stroke-width="4" />
  <line x1="175" y1="80" x2="175" y2="160" stroke="#901446" stroke-width="4" />
