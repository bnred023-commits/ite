<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Untitled Document</title>
<script type="text/javascript" src="jQuery.TosRUs-master/jquery.min.js"></script>
		
		<!-- for dragging/swiping/pinching, include Hammer.js -->
		<script type="text/javascript" src="jQuery.TosRUs-master/hammer.min.js"></script>

		<!-- for scaling UI buttons (for wide websites on small screens), include FlameViewportScale -->
		<script type="text/javascript" language="javascript" src="jQuery.TosRUs-master/lib/FlameViewportScale.js"></script>

		<!-- include Tos "R"Us -->
		<script type="text/javascript" language="javascript" src="jQuery.TosRUs-master/src/js/jquery.tosrus.min.all.js"></script>
		<link type="text/css" media="all" rel="stylesheet" href="jQuery.TosRUs-master/src/css/jquery.tosrus.all.css"/>

		<!-- fire the plugin onDocumentReady -->
		<script type="text/javascript" language="javascript">
		jQuery(function( $ ) {

				//	Add a custom filter to recognize images from lorempixel (that don't end with ".jpg" or something similar)
				$.tosrus.defaults.media.image = {
					filterAnchors: function( $anchor ) {
						return $anchor.attr( 'href' ).indexOf( 'lorempixel.com' ) > -1;
					}
				};

				$('#example-1 a').tosrus({
					buttons: 'inline',
					pagination	: {
						add			: true,
						type		: 'thumbnails'
					}
				});
			});
		</script>
        <style type="text/css" media="all">
			html, body {
				padding: 0;
				margin: 0;
				height: 100%;
			}
			body {
				font-family: Arial, Helvetica, Verdana;
				color: #666;
			}
			a, a:link, a:active, a:visited {
				color: #666;
				text-decoration: underline;
			}
			a:hover {
				color: #000;
			}
			hr {
				margin: 75px -20px;
				height: 0;
				padding: 0;
				border: 0;
				border-top: 1px solid #ccc;
			}
			pre {
				border-left: 5px solid #ccc;
				width: 100%;
				padding: 10px 0 10px 20px;
				overflow: auto;
			}
			#intro p {
				font-size: 18px;
				line-height: 24px;
			}

			.thumbs,
			.gallery,
			.links,
			.slider {
				border-top: 1px solid #ccc;
				border-bottom: 1px solid #ccc;
				margin: 20px -50px;
			}
			.thumbs {
				padding: 10px 30px 30px 50px;
				text-align: center;
			}
			.thumbs:after {
				content: " ";
				display: block;
				clear: both;
			}
			.thumbs a {
				display: inline-block;
				margin: 20px 20px 0 0;
			}
			thumbs img
			{
				width: 130px;
				height: 130px;
			}
			.thumbs img,
			.gallery img {
				border: 1px solid #ccc;
				background: #fff;
				padding: 9px;
			}
			.thumbs a:hover img {
				border-color: #999;
			}
			.gallery {
				height: 300px;
				padding: 30px 0;
			}
			.slider {
				height: 475px;
			}
			.links {
				padding: 30px 50px;
			}
			.links a {
				line-height: 30px;
			}

			.hidden {
				display: none;
			}
		</style>
</head>

<body>
	<div id="example-1" class="thumbs">
					<a href="http://lorempixel.com/1200/675/cats/5/">
						<img src="http://lorempixel.com/130/130/cats/5/" /></a>
					<a href="http://lorempixel.com/1200/675/cats/6/">
						<img src="http://lorempixel.com/130/130/cats/6/" /></a>
					<a href="http://lorempixel.com/1200/675/cats/7/">
						<img src="http://lorempixel.com/130/130/cats/7/" /></a>
					<a href="http://lorempixel.com/1200/675/cats/8/">
						<img src="http://lorempixel.com/130/130/cats/8/" /></a>
				</div>
</body>
</html>
